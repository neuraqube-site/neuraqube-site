<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — NeuraQube</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="antialiased text-slate-800 bg-white">
  <header class="backdrop-blur bg-white/50 sticky top-0 z-40 shadow-sm">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <img src="assets/img/logo.svg" alt="NeuraQube logo" class="h-9 w-9"/>
        <div>
          <div class="font-semibold text-lg">NeuraQube</div>
          <div class="text-xs text-slate-500">Strategy. Innovation. Execution</div>
        </div>
      </a>
      <nav class="hidden md:flex items-center gap-6 text-sm">
        <a href="about.html" class="hover:underline">About</a>
        <a href="services.html" class="hover:underline">Services</a>
        <a href="products.html" class="hover:underline">Products</a>
        <a href="contact.html" class="text-white bg-gradient-to-r from-indigo-500 via-violet-500 to-pink-500 px-4 py-2 rounded-md shadow">Contact</a>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-16">
    <h1 class="text-3xl font-bold">Get in touch</h1>
    <p class="mt-4 text-slate-600">Tell us about your project, and we’ll propose a quick next step.</p>

    <div class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-8">
      <form action="https://formsubmit.co/YOUR_EMAIL_HERE" method="POST" class="space-y-4">
        <input type="hidden" name="_captcha" value="false">
        <div>
          <label class="block text-sm">Name</label>
          <input name="name" required class="mt-2 w-full px-4 py-2 border rounded" />
        </div>
        <div>
          <label class="block text-sm">Email</label>
          <input type="email" name="email" required class="mt-2 w-full px-4 py-2 border rounded" />
        </div>
        <div>
          <label class="block text-sm">Message</label>
          <textarea name="message" rows="5" required class="mt-2 w-full px-4 py-2 border rounded"></textarea>
        </div>
        <div>
          <button type="submit" class="px-5 py-3 rounded-md bg-gradient-to-r from-indigo-600 via-violet-600 to-pink-600 text-white">Send</button>
        </div>
      </form>

      <div class="p-6 border rounded-lg">
        <h3 class="font-semibold">Contact Info</h3>
        <p class="mt-2 text-slate-600">Email: <a href="mailto:hi@neuraqube.com" class="underline">hi@neuraqube.com</a></p>
        <p class="mt-1 text-slate-600">LinkedIn: <a href="#" class="underline">Profile</a></p>
        <div class="mt-6">
          <h4 class="font-semibold">Office</h4>
          <p class="text-sm text-slate-600">Bengaluru, India (Remote-first)</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="mt-12 border-t">
    <div class="max-w-6xl mx-auto px-6 py-8 flex items-center justify-between text-sm text-slate-600">
      <div>© 2025 NeuraQube</div>
      <div class="flex gap-4"><a href="contact.html">Contact</a></div>
    </div>
  </footer>
</body>
</html>
